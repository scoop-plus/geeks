name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - shell: powershell
            name: WindowsPowerShell
          - shell: pwsh
            name: PowerShell
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@main
        with:
          fetch-depth: 2
          path: "my_bucket"
      - name: Checkout Scoop
        uses: actions/checkout@main
        with:
          repository: ScoopInstaller/Scoop
          path: "scoop_core"
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          if ([int](git -C .\my_bucket rev-list --count HEAD) -le 1) {
            $env:CI = $false
          }
          .\my_bucket\bin\test.ps1
